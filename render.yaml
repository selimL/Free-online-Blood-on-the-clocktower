# Render.com "Blueprint": one free web service that builds the client and runs the game server.
# Render provides PORT; the voice keys are entered in Render's dashboard (never committed).
services:
  - type: web
    name: clocktower-nights
    runtime: node
    plan: free
    branch: Main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
