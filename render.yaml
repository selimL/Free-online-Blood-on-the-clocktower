# Render.com "Blueprint": one free web service that builds the client and runs the game server.
# Render provides PORT; the voice keys are entered in Render's dashboard (never committed).
services:
  - type: web
    name: clocktower-nights
    runtime: node
    plan: free
    branch: Main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # free Upstash Redis database so games survive restarts and sleep (see README)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # admin page (/admin) and optional sign-in methods (see README "Accounts and the admin page")
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
